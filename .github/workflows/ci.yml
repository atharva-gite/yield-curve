name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 8 * * 1"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: |
          set +e
          pytest tests/ --tb=short > pytest-out.txt 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            python -c 'from pathlib import Path; text = Path("pytest-out.txt").read_text(errors="replace"); start = text.rfind("FAILURES"); snippet = (text[start:] if start >= 0 else text)[-2500:]; print("::error title=pytest::" + snippet.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))'
          fi
          exit "$code"

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check logic.py app.py tests/
